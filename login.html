<!doctype html>
<html lang="th">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>เข้าสู่ระบบ | DELEF FEST GOPASS</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="css/app.css"
    >
</head>


<body class="login-page">

    <!-- =========================
         LOGIN
    ========================== -->
    <section class="login-box">

        <!-- Logo -->
        <a
            class="brand center"
            href="index.html"
        >
            <img
                src="images/logo1.png"
                alt="DELEF FEST"
            >

            <span>
                DELEF FEST
                <small>GOPASS</small>
            </span>
        </a>


        <!-- Title -->
        <h1>
            เข้าสู่ระบบ
        </h1>

        <p>
            เข้าสู่ระบบด้วย Discord เพื่อกดบัตร
        </p>


        <!-- Discord Login -->
        <button
            onclick="demoLogin()"
            class="discord"
        >
            <i class="fa-brands fa-discord"></i>
            Login with Discord
        </button>


        <!-- Demo Notice -->
        <small>
            ตอนนี้เป็น Demo Login เพื่อให้ทดสอบหน้าเว็บได้ทันที
        </small>


        <!-- Back -->
        <a
            href="index.html"
            class="back"
        >
            <i class="fa-solid fa-arrow-left"></i>
            กลับหน้าแรก
        </a>

    </section>


    <!-- =========================
         CONTACT
    ========================== -->
    <section class="contact-section">

        <div class="contact-title">

            <span>
                CONTACT
            </span>

            <h2>
                ช่องทางการติดต่อ
            </h2>

            <p>
                ติดตามข่าวสารและสอบถามข้อมูลเพิ่มเติม
            </p>

        </div>


        <div class="contact-links">

            <!-- YouTube -->
            <a
                href="#"
                class="contact-item"
            >
                <i class="fa-brands fa-youtube"></i>

                <div>
                    <strong>
                        YouTube
                    </strong>

                    <small>
                        DELEF FEST
                    </small>
                </div>

                <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
            </a>


            <!-- Instagram -->
            <a
                href="#"
                class="contact-item"
            >
                <i class="fa-brands fa-instagram"></i>

                <div>
                    <strong>
                        Instagram
                    </strong>

                    <small>
                        @deleffest
                    </small>
                </div>

                <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
            </a>


            <!-- TikTok -->
            <a
                href="#"
                class="contact-item"
            >
                <i class="fa-brands fa-tiktok"></i>

                <div>
                    <strong>
                        TikTok
                    </strong>

                    <small>
                        @deleffest
                    </small>
                </div>

                <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
            </a>


            <!-- Discord -->
            <a
                href="#"
                class="contact-item"
            >
                <i class="fa-brands fa-discord"></i>

                <div>
                    <strong>
                        Discord
                    </strong>

                    <small>
                        DELEF FEST COMMUNITY
                    </small>
                </div>

                <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
            </a>

        </div>

    </section>


    <!-- =========================
         DEMO LOGIN
    ========================== -->
    <script>
        function demoLogin() {

            localStorage.setItem(
                "delef_user",
                JSON.stringify({
                    name: "Discord User"
                })
            );

            location.href = "index.html";
        }
    </script>

    <script src="js/i18n.js"></script>
</body>

</html>
