<!doctype html>
<html lang="th">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>คอนเสิร์ตทั้งหมด | DELEF FEST GOPASS</title>

    <!-- Favicon -->
    <link
        rel="icon"
        href="images/logo1.png"
    >

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="css/app.css"
    >
</head>


<body>

    <!-- =========================
         HEADER
    ========================== -->
    <header class="site-header">

        <div class="wrap nav">

            <!-- Logo -->
            <a
                class="brand"
                href="index.html"
            >
                <img
                    src="images/logo1.png"
                    alt="DELEF FEST"
                >

                <span>
                    DELEF FEST
                    <small>GOPASS</small>
                </span>
            </a>


            <!-- Navigation -->
            <nav>

                <a href="index.html">
                    <i class="fa-solid fa-house"></i>
                    หน้าแรก
                </a>

                <a
                    class="active"
                    href="events.html"
                >
                    <i class="fa-solid fa-ticket"></i>
                    คอนเสิร์ต
                </a>

                <a href="events.html">
                    <i class="fa-solid fa-calendar-days"></i>
                    ปฏิทิน
                </a>

            </nav>


            <!-- Login -->
            <a
                class="login-btn"
                href="login.html"
            >
                <i class="fa-brands fa-discord"></i>
                เข้าสู่ระบบ
            </a>

        </div>

    </header>


    <!-- =========================
         EVENTS
    ========================== -->
    <main class="wrap page">

        <!-- Page Header -->
        <div class="page-head">

            <div>

                <span class="kicker">
                    EVENTS
                </span>

                <h1>
                    คอนเสิร์ตทั้งหมด
                </h1>

                <p>
                    งานที่เพิ่มจาก Admin จะแสดงตรงนี้อัตโนมัติ
                </p>

            </div>


            <!-- Search -->
            <div class="search">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    id="search"
                    type="text"
                    placeholder="ค้นหาชื่องาน..."
                >

            </div>

        </div>


        <!-- Event Cards -->
        <div
            id="eventList"
            class="cards"
        >
            <!-- JavaScript จะสร้างรายการคอนเสิร์ตตรงนี้ -->
        </div>

    </main>


    <!-- =========================
         CONTACT
    ========================== -->
    <section class="contact-section">

        <div class="contact-title">

            <span>
                CONTACT
            </span>

            <h2>
                ช่องทางการติดต่อ
            </h2>

            <p>
                ติดตามข่าวสารและสอบถามข้อมูลเพิ่มเติม
            </p>

        </div>


        <!-- Contact Links -->
        <div class="contact-links">

            <!-- YouTube -->
            <a
                href="#"
                class="contact-item"
            >
                <i class="fa-brands fa-youtube"></i>

                <div>
                    <strong>
                        YouTube
                    </strong>

                    <small>
                        DELEF FEST
                    </small>
                </div>

                <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
            </a>


            <!-- Instagram -->
            <a
                href="#"
                class="contact-item"
            >
                <i class="fa-brands fa-instagram"></i>

                <div>
                    <strong>
                        Instagram
                    </strong>

                    <small>
                        @deleffest
                    </small>
                </div>

                <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
            </a>


            <!-- TikTok -->
            <a
                href="#"
                class="contact-item"
            >
                <i class="fa-brands fa-tiktok"></i>

                <div>
                    <strong>
                        TikTok
                    </strong>

                    <small>
                        @deleffest
                    </small>
                </div>

                <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
            </a>


            <!-- Discord -->
            <a
                href="#"
                class="contact-item"
            >
                <i class="fa-brands fa-discord"></i>

                <div>
                    <strong>
                        Discord
                    </strong>

                    <small>
                        DELEF FEST COMMUNITY
                    </small>
                </div>

                <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
            </a>

        </div>

    </section>


    <!-- =========================
         JAVASCRIPT
    ========================== -->
    <script src="js/app.js"></script>

    <script>
        renderEvents();
    </script>

    <script src="js/i18n.js"></script>
</body>

</html>
