<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ข้อมูลผู้ซื้อ | DELEF FEST GOPASS</title>
<link rel="icon" href="images/logo1.png"><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="css/app.css">
<style>
.checkout-page{padding:44px 0 80px}.checkout-wrap{max-width:1080px;margin:auto}.checkout-steps{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:28px}.cstep{display:flex;align-items:center;gap:9px;color:#aaa;font-size:12px}.cstep span{width:38px;height:38px;border:1px solid #ddd;border-radius:50%;display:grid;place-items:center;font-weight:700}.cstep.active{color:#e0000b}.cstep.active span{background:#e0000b;color:#fff;border-color:#e0000b}.cline{height:1px;background:#ddd;width:100px}.checkout-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px}.form-panel,.summary-panel{background:#fff;border:1px solid #ececec;border-radius:24px;padding:30px;box-shadow:0 20px 55px rgba(0,0,0,.06)}.form-panel h1{margin:5px 0 7px;font-size:30px}.form-panel>p{color:#777;font-size:13px}.buyer-field{display:block;margin:20px 0}.buyer-field span{display:block;font-size:13px;font-weight:600;margin-bottom:8px}.buyer-field i{color:#e0000b;width:22px}.buyer-field input{width:100%;padding:14px 15px;border:1px solid #ddd;border-radius:12px;outline:none;font-size:14px;box-sizing:border-box}.buyer-field input:focus{border-color:#e0000b;box-shadow:0 0 0 4px rgba(224,0,11,.08)}.buyer-field input.invalid{border-color:#e0000b}.field-note{display:block;margin-top:6px;color:#888;font-size:11px}.hint{background:#fff8f8;border:1px solid #f4dddd;border-radius:12px;padding:13px;font-size:11px;color:#666;margin:18px 0}.summary-panel{position:sticky;top:24px;height:max-content}.summary-event{display:flex;gap:13px;padding-bottom:18px;border-bottom:1px solid #eee}.summary-event img{width:68px;height:82px;object-fit:cover;border-radius:10px}.summary-event h3{font-size:15px;margin:4px 0}.summary-event p{font-size:11px;color:#777;margin:4px 0}.sum-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee;font-size:12px}.sum-total{display:flex;justify-content:space-between;padding:19px 0;font-size:18px}.sum-total b{color:#e0000b}.queue-chip{margin:18px 0;padding:14px;border-radius:14px;background:#111;color:#fff}.queue-chip small{display:block;color:#aaa}.queue-chip strong{display:block;font-size:24px;letter-spacing:1px;margin-top:3px}.back-link{display:block;text-align:center;margin-top:14px;color:#777;font-size:12px}@media(max-width:800px){.checkout-grid{grid-template-columns:1fr}.summary-panel{position:static}.checkout-steps{gap:8px}.cline{width:25px}.cstep small{display:none}}
</style></head>
<body>
<header class="site-header"><div class="wrap nav"><a class="brand" href="index.html"><img src="images/logo1.png" alt="DELEF FEST"><span>DELEF FEST<small>GOPASS</small></span></a><nav><a href="index.html"><i class="fa-solid fa-house"></i> หน้าแรก</a><a class="active" href="events.html"><i class="fa-solid fa-ticket"></i> คอนเสิร์ต</a></nav></div></header>
<main class="wrap checkout-page"><div class="checkout-wrap">
<div class="checkout-steps"><div class="cstep"><span>01</span><small>เลือกบัตร</small></div><div class="cline"></div><div class="cstep active"><span>02</span><small>ข้อมูลผู้ซื้อ</small></div><div class="cline"></div><div class="cstep"><span>03</span><small>เสร็จสิ้น</small></div></div>
<div class="checkout-grid">
<section class="form-panel"><span class="kicker">BUYER INFORMATION</span><h1>ข้อมูลผู้ซื้อ</h1><p>ข้อมูลนี้จะถูกบันทึกในคำสั่งซื้อเพื่อให้ทีมงานตรวจสอบได้</p>
<form id="buyerForm" novalidate>
<label class="buyer-field"><span><i class="fa-solid fa-envelope"></i> อีเมล</span><input id="email" type="email" placeholder="example@email.com" required><small class="field-note">ใช้สำหรับอ้างอิงรายการสั่งซื้อ</small></label>
<label class="buyer-field"><span><i class="fa-brands fa-discord"></i> Discord</span><input id="discord" type="text" maxlength="50" pattern="[A-Za-z0-9._-]{2,50}" placeholder="DiscordUsername" autocomplete="off" required><small class="field-note">ภาษาอังกฤษ / ตัวเลข / . _ - เท่านั้น</small></label>
<label class="buyer-field"><span><i class="fa-solid fa-gamepad"></i> Roblox</span><input id="roblox" type="text" maxlength="30" pattern="[A-Za-z0-9_]{3,30}" placeholder="RobloxUsername" autocomplete="off" required><small class="field-note">ภาษาอังกฤษ / ตัวเลข / _ เท่านั้น</small></label>
<div class="hint"><i class="fa-solid fa-shield-halved"></i> ระบบจะไม่รับอักขระภาษาไทยใน Discord และ Roblox เพื่อป้องกันข้อมูลผิดรูปแบบ</div>
<button class="btn red full" type="submit" id="continueBtn">ยืนยันข้อมูลและไปใบเสร็จ <i class="fa-solid fa-arrow-right"></i></button></form>
<a class="back-link" href="#" id="backSeat"><i class="fa-solid fa-arrow-left"></i> กลับไปแก้ไขจำนวนบัตร</a></section>
<aside class="summary-panel"><span class="kicker">YOUR ORDER</span><h2>สรุปรายการ</h2><div id="summary">กำลังโหลด...</div></aside>
</div></div></main>
<script>
const params=new URLSearchParams(location.search),eventId=params.get("id"),orderId=params.get("order"),saved=JSON.parse(sessionStorage.getItem("delef_checkout")||"null"),buyer=JSON.parse(sessionStorage.getItem("delef_buyer")||"null");
const $=id=>document.getElementById(id); if(buyer){$("email").value=buyer.email||"";$("discord").value=buyer.discord||"";$("roblox").value=buyer.roblox||""} $("backSeat").href="seat.html?id="+encodeURIComponent(eventId||"");
async function loadSummary(){try{const e=await fetch("/api/events/"+encodeURIComponent(eventId)).then(r=>r.json());const qty=Number(saved?.qty||1),type=saved?.ticketType, t=(e.ticketTypes||[]).find(x=>x.id===type), price=Number(saved?.price ?? t?.price ?? 0);$("summary").innerHTML=`<div class="summary-event">${e.image?`<img src="${e.image}" alt="">`:""}<div><h3>${e.name}</h3><p>${e.date} · ${e.time} น.</p><p><i class="fa-solid fa-location-dot"></i> ${e.venue}</p></div></div><div class="queue-chip"><small>หมายเลขรายการ / คิว</small><strong>${saved?.queueCode||"กำลังตรวจสอบ..."}</strong></div><div class="sum-row"><span>ประเภทบัตร</span><b>${t?.name||saved?.ticketType||"-"}</b></div><div class="sum-row"><span>จำนวน</span><b>${qty} ใบ</b></div><div class="sum-row"><span>ราคาต่อใบ</span><b>${price===0?"ฟรี":price.toLocaleString("th-TH")+" บาท"}</b></div><div class="sum-total"><span>ยอดรวม</span><b>${price===0?"ฟรี":(price*qty).toLocaleString("th-TH")+" บาท"}</b></div>`}catch(e){$("summary").textContent="โหลดรายการไม่สำเร็จ"}}
$("buyerForm").addEventListener("submit",async ev=>{ev.preventDefault();const email=$("email").value.trim(),discord=$("discord").value.trim(),roblox=$("roblox").value.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return alert("กรุณากรอกอีเมลให้ถูกต้อง");if(!/^[A-Za-z0-9._-]{2,50}$/.test(discord))return alert("Discord ใช้ภาษาอังกฤษ ตัวเลข และ . _ - เท่านั้น");if(!/^[A-Za-z0-9_]{3,30}$/.test(roblox))return alert("Roblox ใช้ภาษาอังกฤษ ตัวเลข และ _ เท่านั้น");const btn=$("continueBtn");btn.disabled=true;try{const r=await fetch("/api/orders/"+encodeURIComponent(orderId),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,discord,roblox})});const d=await r.json();if(!r.ok)throw new Error(d.message||"บันทึกข้อมูลไม่สำเร็จ");sessionStorage.setItem("delef_buyer",JSON.stringify({email,discord,roblox}));location.href="receipt.html?id="+encodeURIComponent(eventId||"")+"&order="+encodeURIComponent(orderId||"")}catch(e){alert(e.message);btn.disabled=false}});
loadSummary();
</script>    <script src="js/i18n.js"></script>
</body></html>
