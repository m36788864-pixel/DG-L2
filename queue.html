<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>รอคิว | DELEF FEST GOPASS</title><link rel="icon" href="images/logo1.png"><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="css/app.css"></head><body><header class="site-header"><div class="wrap nav"><a class="brand" href="index.html"><img src="images/logo1.png" alt="DELEF FEST"><span>DELEF FEST<small>GOPASS</small></span></a></div></header>
<main class="wrap page narrow"><section class="queue-box queue-premium"><div class="queue-icon"><i class="fa-solid fa-hourglass-half"></i></div><span class="kicker">SECURE WAITING ROOM</span><h1>กำลังจัดคิวให้คุณ</h1><p>ระบบออกหมายเลขคิวจริงให้แล้ว กรุณารอจนถึงขั้นตอนเลือกบัตร</p><strong id="queueNo">#----</strong><div class="queue-stats"><div><i class="fa-solid fa-users"></i><small>คิวก่อนหน้า</small><b id="ahead">--</b></div><div><i class="fa-solid fa-clock"></i><small>สถานะ</small><b id="wait">กำลังโหลด</b></div></div><div class="progress"><div id="bar"></div></div><p id="queueStatus">กำลังเชื่อมต่อระบบคิว...</p></section></main>
<script>
const eventId=new URLSearchParams(location.search).get("id");let p=0;
async function start(){try{const old=sessionStorage.getItem("delef_queue_token")||"";const r=await fetch("/api/queue/"+encodeURIComponent(eventId)+"?token="+encodeURIComponent(old));const d=await r.json();if(!r.ok)throw new Error(d.message||"ไม่สามารถเข้าคิวได้");sessionStorage.setItem("delef_queue_token",d.token);sessionStorage.setItem("delef_queue_code",d.queueCode);document.getElementById("queueNo").textContent=d.queueCode;document.getElementById("ahead").textContent=Number(d.ahead).toLocaleString("th-TH");document.getElementById("wait").textContent="พร้อมเข้าระบบ";document.getElementById("queueStatus").textContent="ระบบกำลังพาคุณไปยังหน้าเลือกบัตร";const t=setInterval(()=>{p+=4;document.getElementById("bar").style.width=Math.min(100,p)+"%";if(p>=100){clearInterval(t);location.href="seat.html?id="+encodeURIComponent(eventId)}} ,120);}catch(e){document.getElementById("queueStatus").textContent=e.message;document.getElementById("wait").textContent="ไม่สำเร็จ";}}start();
</script>    <script src="js/i18n.js"></script>
</body></html>
